name: Claim
description: Let contributors claim an issue or give up their own assignment using issue comments.

# GitHub has no built-in assignment slash command; this lets contributors take
# an issue without repository write access or a maintainer using the assignee UI.
# Callers own the event trigger and the issues: write and pull-requests: write
# permissions. This action only talks to the API: no checkout or
# contents: read permission is needed.
# Serialize per issue with cancel-in-progress: false so competing claimants both
# receive an answer instead of one run being cancelled in the middle of a claim.
inputs:
  token:
    description: GitHub token with issues write and pull-requests write permission.
    required: false
    default: ${{ github.token }}
  repository:
    description: Repository in owner/name format.
    required: false
    default: ${{ github.repository }}
  issue:
    description: Issue number.
    required: false
    default: ${{ github.event.issue.number }}
  actor:
    description: Commenter's login.
    required: false
    default: ${{ github.event.comment.user.login }}
  actor-type:
    description: Commenter's GitHub account type.
    required: false
    default: ${{ github.event.comment.user.type }}
  body:
    description: Comment body containing the command.
    required: false
    default: ${{ github.event.comment.body }}
  max-claims:
    description: Maximum open claims per repository role, as comma-separated ROLE=CAP pairs; roles are read, triage, write, maintain, admin; a cap of -1 is unlimited, 0 forbids the role, and the value -1 alone disables the cap
    required: false
    default: -1
  expire:
    description: Days before an idle claim expires; -1 never expires, a positive integer counts days, and any value that is not -1 or a positive integer fails the run
    required: false
    default: -1

runs:
  using: composite
  steps:
    - name: Set up Python
      id: python
      # update-environment: false leaves the caller's Python and PATH alone.
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.15.1"
        update-environment: false
    - name: Claim or unclaim
      shell: bash
      # Public comment text is attacker-controlled: pass it as environment data,
      # never interpolate it into a shell program. The script accepts only an exact
      # command after stripping carriage returns and trimming ASCII whitespace.
      env:
        CLAIM_PYTHON: ${{ steps.python.outputs.python-path }}
        GH_TOKEN: ${{ inputs.token }}
        CLAIM_REPOSITORY: ${{ inputs.repository }}
        CLAIM_ISSUE: ${{ inputs.issue }}
        CLAIM_ACTOR: ${{ inputs.actor }}
        CLAIM_ACTOR_TYPE: ${{ inputs.actor-type }}
        CLAIM_BODY: ${{ inputs.body }}
        CLAIM_MAX_CLAIMS: ${{ inputs.max-claims }}
        CLAIM_EXPIRE: ${{ inputs.expire }}
      run: '"$CLAIM_PYTHON" "$GITHUB_ACTION_PATH/claim.py"'
