# EXTENDS the default ruleset; it never replaces it. Without `useDefault`,
# gitleaks reads a config file as the whole rule set, so a repository with
# an empty one scans for nothing -- measured against 8.30.1: with this file
# a planted key is still found, with the same file emptied it is not.
#
# There is no allowlist here, and that is the point of committing the file:
# the default rules ran clean against this repository's full history, and any
# future allowlist entry is a line a reviewer sees in the diff of the change
# that adds it. The scan's other routes are the inline `gitleaks:allow`
# marker, which the script's --ignore-gitleaks-allow turns off, and a tracked
# `.gitleaksignore`, which a change can only add with a forced `git add` and
# which then shows in its diff.
[extend]
useDefault = true
