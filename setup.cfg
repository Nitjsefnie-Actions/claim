# pycodestyle configuration for the suites job's pycodestyle gate. The
# tree's measured convention: at the default 79 columns the gate's first
# run reported ~80 E501 findings and none of them defects; 100 is the
# ceiling the reviewed tree actually observes. No `ignore =` line: adding
# one would REPLACE pycodestyle's default ignore list (E121, E123, E126,
# E226, E24, E704, W503, W504) rather than extend it, and this tree needs
# no addition — pr-gate's E402 ignore answers a sys.path-before-import
# pattern this tree does not have.
[pycodestyle]
max-line-length = 100
