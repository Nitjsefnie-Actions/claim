name: size baseline
# Ratchets tracked file line counts against .github/size-baseline.json:
# growth past a record fails a pull request, a main push tightens them.
# No workflow_dispatch: mode auto fails closed on any other event.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: size-baseline-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  size-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: Nitjsefnie-Actions/size-ratchet@67bb01e536611398a3b5cedd3f3cf95fd6e5693e # v1.0.1
        with:
          ceilings: ''
          overrides: ''
          exclude: ''
          unclassified: 'ignore'
          records: '.github/size-baseline.json'
          member: ''
          mode: 'auto'
          base-ref: ${{ github.event.pull_request.base.sha }}
          stale: 'warn'
          require-tight: 'false'

      - name: Stage changed records for the ratchet push
        id: stage
        if: github.event_name == 'push'
        env:
          CLAIM_BASE_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$CLAIM_BASE_SHA" ]; then
            echo 'Checkout does not match the measured run head' >&2
            exit 1
          fi
          changed=0
          git diff --quiet -- .github/size-baseline.json || changed=$?
          if [ "$changed" -gt 1 ]; then
            echo "git diff failed with $changed" >&2
            exit "$changed"
          fi
          if [ "$changed" -eq 0 ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/ratchet-data"
          cp .github/size-baseline.json "$RUNNER_TEMP/ratchet-data/size-baseline.json"
          printf '%s\n' "$(git rev-parse HEAD)" > "$RUNNER_TEMP/ratchet-data/base.txt"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Upload the changed records
        if: success() && steps.stage.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-baseline-ratchet
          path: ${{ runner.temp }}/ratchet-data
          if-no-files-found: error
          retention-days: 1
