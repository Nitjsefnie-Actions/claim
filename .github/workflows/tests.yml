name: tests

# Linux-only checks cannot establish macOS portability. The two POSIX legs
# run the same real-subprocess behavioral suite, including the bash API
# stub, plus the ruff lint and the pycodestyle/pylint/pyright checks, and
# coverage is measured on the ubuntu cell only. The windows leg runs the
# workflow's own bash steps -- the merge-conflict marker check, the
# python3 PATH shim and the compile check -- while the behavioral suite
# and the venv-backed checks stay scoped to the POSIX legs (see those
# steps for why). The python-versions job runs the full suite on Python
# 3.11-3.14 on ubuntu.
#
# The suite stays install-free by design (#87): everything it runs ships with
# the images -- bash, python3, and shellcheck -- and tests/gh.sh supplies the
# API stub. The file's package installs are the workflow's own: the lint
# step's hash-pinned ruff, the type/lint steps' hash-pinned pylint,
# pycodestyle and pyright, and the hash-pinned coverage installed twice --
# in the coverage cell and again in the diff-coverage job, which never runs
# a suite and needs only the statement analyzer -- each lifted out of the
# manifest into a throwaway venv, which no image preinstalls.
#
# Coverage is measured on exactly one cell so the reported number names a
# single reproducible environment. claim.py runs as a SUBPROCESS of the suite
# (the gh stub is a bash script), so `coverage run tests/run.sh` measures
# nothing of it: the measurer must start inside every python3 the suite
# starts. The Install coverage tooling step writes coverage's startup hook
# into that venv and arms COVERAGE_PROCESS_START, so that is where it starts
# -- and on every other cell the step is skipped, and the suite runs exactly
# as it always has. The floor lives in .github/ci-thresholds.json and is
# never restated here; the summary renders whether or not the gate fails.
#
# The same measurement is also reported per change: the measured cell writes
# the XML form of it, the pull-request-only `diff-coverage` job diffs the
# merge commit against its base and renders what the change ADDED, and the
# `coverage-comment` workflow posts it as one pull-request comment. That
# report is deliberately not a gate -- see .github/scripts/diff_coverage.py.

on:
  push:
    # Default branch only: a pull-request head already gets one run from
    # the `pull_request` event below, and an unfiltered `push` schedules
    # the same commit a second time under a different ref, which the
    # `concurrency` group cannot collapse.
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this job only reads the tree. Without an explicit
# block it inherits the repository default, which can be read/write
# for the whole token.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the secrets scan at the bottom of this job reads
          # `git log -p`, so a shallow clone would scan a suffix of history
          # and call the rest clean. A git history read inherits the
          # checkout's depth.
          fetch-depth: 0
          # Nothing pushes; later steps must not inherit a stored token.
          persist-credentials: false

      - name: Require this head to carry main's gate-defining commits
        # `main requires green checks` sets strict_required_status_checks_policy
        # to false, so a green head vouches only for the tree this run checked
        # out: a commit that lands on main touching a file a required check
        # reads is never applied to a pull request before it merges, and the
        # merge then publishes a tree no green run ever saw. This is the only
        # check that compares the two.
        #
        # In a job that is ALREADY a required status context, because a new job
        # would be a new context — which means editing the ruleset — and a
        # `paths:` filter on any workflow with a required job would stop this
        # reporting at all and block every pull request instead (see the same
        # trap documented on actionlint.yml's pull_request trigger).
        #
        # Before the lint step: work done against a base main has already moved
        # on from is work whose verdict does not carry.
        run: python3 tests/gate_base_freshness.py

      - name: Refuse a commit whose scope names a workflow outside the ci type
        # CONTRIBUTING.md's scope table allows a workflow's name as a scope
        # only with type `ci`, and prose no gate reads is a convention — the
        # two fix(tests) commits on main are that table losing. In this job
        # rather than a new one: a new job would be a new required status
        # context, which means editing the ruleset, and a job that is already
        # required is where the freshness step went for the same reason.
        # After the freshness step: both compare the head against freshly
        # fetched main, and both must read the rebased head.
        run: python3 tests/commit_scopes.py

      # ShellCheck ships with the image (0.9.0-1 on ubuntu-24.04, which
      # ubuntu-latest currently maps to, per the runner-images docs:
      # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md),
      # so no install step: its apt mirror fetch hung intermittently until
      # the job timeout, while a missing binary fails the step in seconds
      # instead of hanging.

      - name: Check every shell file
        # Recurse so adding a nested test helper cannot silently escape lint.
        run: |
          find tests -type f -name '*.sh' -exec shellcheck {} +

      - name: Download gitleaks and verify its digest
        # Last in the job: the three checks above refuse in seconds, while
        # this downloads a binary and walks the full history, so a head that
        # is stale, mis-scoped or badly linted never pays for the scan.
        # Checksum-verified rather than piped from an install script: `curl |
        # bash` would make this job trust whatever that URL serves at run
        # time. The digest is from the release's own checksums file, and a
        # version bump moves it together with secrets.yml's copy of this
        # step.
        run: |
          curl --connect-timeout 5 --max-time 120 -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks

      - name: Scan the tree and the history for secrets
        # Bare on purpose: this step's exit status IS the gate, so no
        # condition, fallback or error-swallowing suffix belongs here. The
        # log is public: --verbose names findings, --redact masks them.
        # No --config and no .gitleaks.toml: the default ruleset ran clean
        # against this repository's full history, so an allowlist here would
        # be a way to silence a future finding nobody reviewed.
        # In this job rather than a new one: `shellcheck` is already a
        # required status context running on every pull request and every
        # push to main, both unfiltered, so the scan gates exactly the commits
        # a standalone scan job would — a new job would be a new required
        # context, which means editing the ruleset, and actionlint is
        # disqualified as the host because its push trigger is paths:-filtered
        # to workflow files, so a secret committed to claim.py on main would
        # never start the scan.
        run: ./gitleaks detect --verbose --redact

  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in
          # .git/config lets any later step reuse it.
          persist-credentials: false

      - name: Put a python3 on PATH
        # The windows image provides `python` but not `python3`, and the
        # steps below and tests/run.sh all call `python3` by name. The shim
        # is the suite's own install-free fix: a two-line sh script on PATH,
        # no package install. `shell: bash` because the body is bash syntax
        # -- on windows the default shell is pwsh, and Git Bash executes the
        # extension-less shim where pwsh would not.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/bin/python3"
          chmod +x "$RUNNER_TEMP/bin/python3"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/python3" --version

      - name: Check no tracked file carries a merge-conflict marker
        # a3363ac landed on main with `<<<<<<< HEAD` and the `>>>>>>> 0d9bffc`
        # line still in README.md, and three review rounds and every gate in
        # this repository read straight past them: a conflict marker is text
        # that looks like prose in a Markdown file, so only a mechanical check
        # can see it. git grep reads the tracked files out of the working
        # tree, which on a clean checkout is what the repository ships, and
        # -I keeps a binary from being reported as a match. The three markers
        # are matched in the shapes git writes them: `<<<<<<< ` and `>>>>>>> `
        # carry the label after seven characters, and the separator is exactly
        # seven `=`; diff3's extra `||||||| base` line changes nothing, because
        # the other three are still written. This job rather than the
        # actionlint one because this workflow's push trigger is unfiltered,
        # so it runs for the documentation-only commit that carries the marker
        # as well as for the code change.
        # Explicit `shell: bash` so the step also runs on the windows leg,
        # whose default shell is pwsh and cannot run this bash body; on the
        # POSIX legs the explicit form also adds --noprofile --norc, and
        # pipefail is its only operative delta -- the body already guards
        # `git grep` with `|| found=$?`, so no pipe here can turn "no match"
        # into a failure the implicit shell would not have.
        shell: bash
        run: |
          # git grep exits 1 for "no match" and above 1 for an error it could
          # not run, and a guard that reads its own error as a clean tree is
          # the false green this step exists to prevent.
          found=0
          git grep -nI -E '^(<{7}( |$)|>{7}( |$)|={7}$)' -- . || found=$?
          if [ "$found" -gt 1 ]; then
            echo "git grep exited $found, so no marker was looked for."
            exit "$found"
          fi
          if [ "$found" -eq 0 ]; then
            echo "A merge-conflict marker is committed. Resolve the conflict, rebase onto the target branch and push again."
            exit 1
          fi

      - name: Compile the claim script
        # Explicit `shell: bash` so the step also runs on the windows leg,
        # whose default shell is pwsh and cannot run this body; on the POSIX
        # legs the explicit form also adds --noprofile --norc, and pipefail
        # is its only operative delta.
        shell: bash
        run: python3 -m py_compile claim.py

      - name: Lint the claim script
        # py_compile above refuses a file only for a SyntaxError: E9 and
        # F7's misplaced break/continue already fall inside that refusal.
        # What it accepts silently is the rest of the set -- F631 (assert
        # on a tuple), F632 (comparison with a literal), F633 (invalid
        # print syntax), F634 (condition on a tuple), F82 (undefined
        # names) -- undefined names above all. The lint runs the whole
        # defect-oriented intersection set pr-gate gates, and
        # deliberately not plain F, whose F401 and F841 red CI on benign
        # refactors.
        # Why the venv: both hosted images mark their system python externally
        # managed (PEP 668), so a plain pip install fails on all legs. The
        # suites job keeps the images' preinstalled python3; only the
        # python-versions job runs setup-python, to pin the four explicit
        # versions it covers, and setup-python installs an interpreter, never
        # packages, so the suite stays install-free (#87).
        # Why the awk extraction: the manifest's PyYAML pin carries one hash,
        # a cp313 manylinux x86_64 wheel, so installing the whole file with
        # --require-hashes resolves nothing on macOS. The ruff block alone is
        # platform-complete; the manifest stays the single source for the
        # version and hashes.
        # POSIX legs only: the venv's interpreter sits at venv/bin/python on
        # POSIX and venv/Scripts/python.exe on Windows, and this step is
        # written for the POSIX layout; extending it to Windows is future
        # work.
        if: matrix.os != 'windows-latest'
        run: |
          python3 -m venv "$RUNNER_TEMP/lint-venv"
          awk '/^ruff==/{f=1} f{print; if ($0 !~ /\\$/) exit}' .github/workflows/requirements.txt > "$RUNNER_TEMP/ruff.txt"
          "$RUNNER_TEMP/lint-venv/bin/python" -m pip install --require-hashes -r "$RUNNER_TEMP/ruff.txt"
          "$RUNNER_TEMP/lint-venv/bin/ruff" check --select E9,F63,F7,F82 claim.py

      - name: Install the type and lint toolchain
        id: install_checks
        # Why the venv: both hosted images mark their system python externally
        # managed (PEP 668), so a plain pip install fails on all legs. The
        # suites job keeps the images' preinstalled python3; only the
        # python-versions job runs setup-python, to pin the four explicit
        # versions it covers, and setup-python installs an interpreter, never
        # packages, so the suite stays install-free (#87).
        # Why the awk lift: the manifest's PyYAML pin carries one hash, a
        # cp313 manylinux x86_64 wheel, so installing the whole file with
        # --require-hashes resolves nothing on macOS. The lift reaches from
        # the coverage block to EOF, one plain range like every other lift
        # in this workflow: the files these checks read import coverage
        # (.github/scripts/diff_coverage.py), so the venv that lints the
        # tree must resolve what the tree imports, and coverage sitting
        # before pylint in the manifest puts both blocks plus pylint's
        # dependencies inside the one range. The manifest stays the single
        # source for the versions and hashes.
        # POSIX legs only: the venv's interpreter sits at venv/bin/python on
        # POSIX and venv/Scripts/python.exe on Windows, and this step is
        # written for the POSIX layout; extending it to Windows is future
        # work. The three checks below chain on
        # steps.install_checks.outcome == 'success', so each self-skips
        # wherever this install is skipped, including the windows leg.
        if: matrix.os != 'windows-latest'
        run: |
          python3 -m venv "$RUNNER_TEMP/checks-venv"
          awk '/^(coverage|pylint)==/{f=1} f' .github/workflows/requirements.txt > "$RUNNER_TEMP/checks.txt"
          "$RUNNER_TEMP/checks-venv/bin/python" -m pip install --require-hashes -r "$RUNNER_TEMP/checks.txt"

      - name: pycodestyle
        if: ${{ !cancelled() && steps.install_checks.outcome == 'success' }}
        run: |
          # pycodestyle reads setup.cfg from the working directory: the
          # 100-column ceiling the tree observes lives there, not on this
          # command line. This comment is also how the freshness
          # derivation sees the file, the way .coveragerc enters its set.
          git ls-files '*.py' | xargs "$RUNNER_TEMP/checks-venv/bin/pycodestyle"

      - name: pylint
        if: ${{ !cancelled() && steps.install_checks.outcome == 'success' }}
        run: |
          # .pylintrc turns the style categories off and leaves the error
          # and warning checks on, and the exit code is the verdict --
          # never the 10.00/10 score line, which reports nothing about
          # what was found.
          git ls-files '*.py' | xargs "$RUNNER_TEMP/checks-venv/bin/pylint" --rcfile=.pylintrc

      - name: pyright
        if: ${{ !cancelled() && steps.install_checks.outcome == 'success' }}
        run: |
          # Basic mode, with the include list (claim.py and tests/) in
          # pyrightconfig.json. The exit code is the gate: no baseline and
          # no ratchet, because the tree passes outright.
          "$RUNNER_TEMP/checks-venv/bin/pyright" --project pyrightconfig.json
      # The measured cell's coverage install lifts the coverage block out of
      # the hash-pinned manifest into a venv (PEP 668 marks both hosted
      # images' system python externally managed, so a plain pip install
      # fails), writes coverage's startup hook into that venv, and arms the
      # three env vars the rest of the job inherits through GITHUB_ENV --
      # PATH first, so the suite's run step and the coverage commands below
      # resolve the venv's python3. The run step stays byte-for-byte what it
      # was, and on every other cell the step is skipped, and the suite runs
      # exactly as before.
      - name: Install coverage tooling
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m venv "$RUNNER_TEMP/coverage-venv"
          awk '/^coverage==/{f=1} f{print; if ($0 !~ /\\$/) exit}' .github/workflows/requirements.txt > "$RUNNER_TEMP/coverage.txt"
          "$RUNNER_TEMP/coverage-venv/bin/python" -m pip install --require-hashes -r "$RUNNER_TEMP/coverage.txt"
          site_dir="$("$RUNNER_TEMP/coverage-venv/bin/python" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          printf 'import coverage; coverage.process_startup()\n' > "$site_dir/00-claim-coverage-subprocess.pth"
          mkdir -p "$RUNNER_TEMP/claim-coverage"
          {
            echo "PATH=$RUNNER_TEMP/coverage-venv/bin:$PATH"
            echo "COVERAGE_PROCESS_START=$PWD/.coveragerc"
            echo "COVERAGE_FILE=$RUNNER_TEMP/claim-coverage/.coverage"
          } >> "$GITHUB_ENV"

      - name: Run the behavioral suite
        # POSIX legs only. tests/gh.sh is an extension-less bash script
        # placed on PATH as `gh`, and claim.py spawns `gh` by bare name: on
        # Windows CreateProcess appends .exe before it searches PATH, so the
        # extension-less stub is never selected at all -- with the image's
        # real gh.exe on PATH the cases would run against it, and without
        # one every case fails to start with WinError 2 (file not found).
        # Either way the stub never executes, so the suite cannot run on
        # Windows. (Error 193, %1 is not a valid Win32 application, is the
        # explicit-path shape and does not arise for a bare-name spawn.)
        # Real consumers are unaffected: they run the real gh.exe on
        # windows runners. This is a harness limitation, not a product
        # defect; widening the leg needs a Windows-executable stub form,
        # tracked in the issue tracker.
        if: matrix.os != 'windows-latest'
        shell: bash
        run: tests/run.sh

      # The suite's python3 processes each wrote their own data file (parallel
      # mode in .coveragerc), so they are combined before anything reads a
      # total; the summary renders whether or not the gate fails. Every
      # coverage command names its config with --rcfile so the steps do not
      # lean on coverage's working-directory discovery.
      - name: Record the coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m coverage combine --rcfile=.coveragerc
          python3 -m coverage report --format=markdown --precision=1 --rcfile=.coveragerc >> "$GITHUB_STEP_SUMMARY"

      # The floor is read from the committed file rather than restated here, so
      # a floor change is a diff to the file a reviewer sees, not a buried
      # literal in the step.
      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: |
          floor="$(python3 -c 'import json; print(json.load(open(".github/ci-thresholds.json"))["coverage"]["python"]["floor"])')"
          python3 -m coverage report --fail-under="$floor" --precision=1 --rcfile=.coveragerc

      # The XML form of the same measurement the summary and the gate just
      # read: the pull-request-only diff-coverage job cannot re-run the suite
      # to make one, so the measured cell ships it. Both steps are gated to
      # this one leg: a run's artifact names are one namespace shared by every
      # job in it, and this matrix has exactly one uploading leg, so the
      # `coverage-xml` name names one measurement by construction.
      - name: Write the coverage XML
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m coverage xml --rcfile=.coveragerc -o coverage.xml

      - name: Upload the coverage XML
        # actions/upload-artifact v7.0.1
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  # The suites job pins OS coverage at each image's preinstalled python3;
  # this job pins Python coverage at pr-gate's four supported versions.
  # Informational, never required: a new job name is not a required status
  # context, and making one required is a ruleset edit the maintainer
  # makes, not this workflow.
  python-versions:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in
          # .git/config lets any later step reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run the behavioral suite
        shell: bash
        run: tests/run.sh
  # The per-change half of the coverage story (#129): of the lines this pull
  # request ADDED that coverage considers executable, how many the suite
  # reached. INFORMATIONAL, never a gate -- the tree-wide floor in the
  # Coverage gate step is the gate, and a number a reviewer judges (a refactor
  # that moves code, a change that only deletes) must not be able to block a
  # merge, which is also why this job is deliberately absent from no required
  # context and fails nothing below it.
  #
  # Pull requests only, and only when the suite actually measured: a skipped
  # or failed ancestor must not be reported as a number.
  diff-coverage:
    needs: suites
    if: ${{ !cancelled() && needs.suites.result == 'success' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # This job checks out and runs code from the pull request (the script
    # below is the pull request's own copy), so it must not carry a token
    # that can write conversation. The trusted coverage-comment workflow
    # owns that token.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit the event named -- the exact SHA the suites job
          # measured -- and not `refs/pull/N/merge` resolved now, which could
          # hand this job a different tree than the one the report describes
          # if GitHub recomputed the merge ref between the two jobs. Full
          # history, because the diff below needs HEAD^1, the base tip that
          # was merged into it.
          ref: ${{ github.sha }}
          fetch-depth: 0
          # Nothing in this job pushes; later steps must not inherit a stored
          # token.
          persist-credentials: false

      - name: Download the coverage XML
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-xml

      # The same install the coverage cell makes, for the same reason: the
      # statement analyzer the script drives is coverage.py, which no image
      # preinstalls and a PEP 668 system python refuses to take. No startup
      # hook and no COVERAGE_PROCESS_START here -- no suite runs in this job,
      # so there is nothing to measure, only a report to read.
      - name: Install coverage tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/coverage-venv"
          awk '/^coverage==/{f=1} f{print; if ($0 !~ /\\$/) exit}' .github/workflows/requirements.txt > "$RUNNER_TEMP/coverage.txt"
          "$RUNNER_TEMP/coverage-venv/bin/python" -m pip install --require-hashes -r "$RUNNER_TEMP/coverage.txt"
          echo "PATH=$RUNNER_TEMP/coverage-venv/bin:$PATH" >> "$GITHUB_ENV"

      - name: Measure the coverage of this change
        # HEAD is the merge tree checked out above and HEAD^1 is, by
        # construction, the base tip that was merged into it. The event
        # payload's `base.sha` is NOT that: the base branch can advance
        # between the event and the checkout, and every base commit merged in
        # since would then be reported as a line this pull request added.
        run: |
          git diff --text --no-ext-diff --no-textconv --unified=0 HEAD^1 HEAD > patch.diff
          python3 .github/scripts/diff_coverage.py \
            --coverage coverage.xml \
            --diff patch.diff > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package the comment for the trusted commenter
        # Through env, never interpolation: the number is event data, and a
        # run: block that inlined it would be program text built from input.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '%s\n' "$PR_NUMBER" > pr-number.txt

      - name: Upload the comment for the trusted commenter
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diff-coverage-comment
          path: |
            body.md
            pr-number.txt
          if-no-files-found: error
