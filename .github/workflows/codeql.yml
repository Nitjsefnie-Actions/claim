name: codeql

# Static security analysis (advanced setup, not the repo-settings "default
# setup" — the config lives here so it is reviewable in a diff like every
# other gate). Free on this public repository; findings land in the
# Security tab rather than turning the build red, so a new query shipping
# upstream cannot block an unrelated push.
#
# Push and the weekly cron analyse the event's own commit, so SARIF is
# uploaded against exactly the tree that was checked out.
#
# The weekly cron is not redundant with push: CodeQL's query packs are
# updated continuously, and a new query only ever runs against code that
# has changed since it shipped. Without the cron, a rule published today
# would never be applied to a file last touched last year.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  schedule:
    # Wednesday 03:47 UTC. Off the hour and off Monday deliberately: the top
    # of the hour is when every cron on GitHub fires at once and jobs queue.
    - cron: '47 3 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      # Writing the analysis results is the whole point; everything else
      # stays read-only.
      security-events: write
      contents: read

    strategy:
      # Only one language here — this repo is a GitHub Actions composite action.
      # The matrix stays a matrix so adding one later is a one-line change rather
      # than a restructure.
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No `ref:` override here: CodeQL must analyse
          # exactly the commit it will file alerts against, which is the
          # event's own SHA.
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # `security-extended` over the default `security` pack: this action
          # handles untrusted comment text with an issue-writing token, so the
          # additional security queries belong in the advisory analysis.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
